<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物料成本帳</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    margin: 0;
    background: #e7e5e4;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

// ---------- 小型內建圖示（不依賴外部圖示庫，避免部署後失效）----------
function IconBase({ size = 18, strokeWidth = 2, className = "", children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
      {children}
    </svg>
  );
}
const Plus = (p) => <IconBase {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>;
const X = (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
const Check = (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>;
const Trash2 = (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></IconBase>;
const Pencil = (p) => <IconBase {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></IconBase>;
const TrendingUp = (p) => <IconBase {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconBase>;
const TrendingDown = (p) => <IconBase {...p}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></IconBase>;
const AlertTriangle = (p) => <IconBase {...p}><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>;
const Package = (p) => <IconBase {...p}><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></IconBase>;
const Coffee = (p) => <IconBase {...p}><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></IconBase>;
const BarChart3 = (p) => <IconBase {...p}><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></IconBase>;

// ---------- 本機自動儲存 ----------
function usePersistentState(key, initialValue) {
  const [state, setState] = useState(() => {
    try {
      const saved = window.localStorage.getItem(key);
      return saved ? JSON.parse(saved) : initialValue;
    } catch (e) {
      return initialValue;
    }
  });
  useEffect(() => {
    try {
      window.localStorage.setItem(key, JSON.stringify(state));
    } catch (e) {}
  }, [key, state]);
  return [state, setState];
}

// ---------- 初始範例資料 ----------
const initialMaterials = [
  {
    id: "m1", name: "紅茶葉", supplier: "大盤茶行",
    purchaseUnit: "克", packCount: 2, packSize: 6000, totalPrice: 13500,
    conversion: { inputQty: 80, outputQty: 6500, outputUnit: "毫升" },
  },
  {
    id: "m2", name: "鮮奶", supplier: "在地牧場",
    purchaseUnit: "毫升", packCount: 24, packSize: 1000, totalPrice: 1200,
    conversion: null,
  },
  {
    id: "m3", name: "梅子汁", supplier: "食品原料行",
    purchaseUnit: "毫升", packCount: 12, packSize: 550, totalPrice: 960,
    conversion: null,
  },
  {
    id: "m4", name: "綠茶粉", supplier: "食品原料行",
    purchaseUnit: "克", packCount: 1, packSize: 225, totalPrice: 180,
    conversion: null,
  },
  {
    id: "m5", name: "大杯（700ml）", supplier: "包材行",
    purchaseUnit: "個", packCount: 50, packSize: 1, totalPrice: 115,
    conversion: null,
  },
  {
    id: "m6", name: "封膜", supplier: "包材行",
    purchaseUnit: "個", packCount: 100, packSize: 1, totalPrice: 60,
    conversion: null,
  },
];

const initialRecipes = [
  {
    id: "r1",
    name: "招牌紅茶拿鐵",
    sellPrice: 55,
    ingredients: [
      { materialId: "m1", qty: 400 },
      { materialId: "m2", qty: 200 },
      { materialId: "m5", qty: 1 },
      { materialId: "m6", qty: 1 },
    ],
  },
  {
    id: "r2",
    name: "梅子綠茶",
    sellPrice: 48,
    ingredients: [
      { materialId: "m4", qty: 15 },
      { materialId: "m3", qty: 100 },
      { materialId: "m5", qty: 1 },
      { materialId: "m6", qty: 1 },
    ],
  },
];

const uid = () => Math.random().toString(36).slice(2, 10);

// 一般金額（總價、小計）：2位小數
const money = (n) =>
  (Math.round((n || 0) * 100) / 100).toLocaleString("zh-TW", { maximumFractionDigits: 2 });

// 單位成本（每克/每毫升）：先算到小數第6位，再無條件捨去到第5位（只捨不入）
const unitMoney = (n) => {
  const v = Number(n) || 0;
  const roundedTo6 = Math.round(v * 1e6) / 1e6;
  const truncatedTo5 = Math.floor(roundedTo6 * 1e5) / 1e5;
  return truncatedTo5.toLocaleString("zh-TW", { maximumFractionDigits: 5 });
};

// 算出一項物料「實際用在配方裡」的單位與成本
function getEffective(m) {
  if (!m) return { unit: "", cost: 0, purchaseUnit: "", purchaseCost: 0 };
  const totalQty = (m.packCount || 1) * (m.packSize || 0);
  const purchaseCost = totalQty > 0 ? m.totalPrice / totalQty : 0;
  if (m.conversion && m.conversion.outputQty > 0) {
    const cost = (m.conversion.inputQty * purchaseCost) / m.conversion.outputQty;
    return { unit: m.conversion.outputUnit, cost, purchaseUnit: m.purchaseUnit, purchaseCost };
  }
  return { unit: m.purchaseUnit, cost: purchaseCost, purchaseUnit: m.purchaseUnit, purchaseCost };
}

// ---------- 收據打洞邊緣 ----------
function PerfEdge({ flip }) {
  return (
    <div
      className={flip ? "rotate-180" : ""}
      style={{
        height: 10,
        backgroundImage: "radial-gradient(circle at 9px 0px, #D6D3D1 6px, transparent 6.5px)",
        backgroundSize: "18px 12px",
        backgroundRepeat: "repeat-x",
        backgroundPosition: "0 -6px",
      }}
    />
  );
}

function Dashed() {
  return <div className="border-t border-dashed border-stone-300 my-3" />;
}

function Money({ value, className = "" }) {
  return <span className={`font-mono tabular-nums ${className}`}>${money(value)}</span>;
}

// ---------- 主元件 ----------
function CostTracker() {
  const [tab, setTab] = useState("overview");
  const [materials, setMaterials] = usePersistentState("cost-tracker-materials", initialMaterials);
  const [recipes, setRecipes] = usePersistentState("cost-tracker-recipes", initialRecipes);

  const materialMap = useMemo(
    () => Object.fromEntries(materials.map((m) => [m.id, m])),
    [materials]
  );

  const recipeCost = (r) =>
    r.ingredients.reduce((sum, ing) => {
      const m = materialMap[ing.materialId];
      const eff = getEffective(m);
      return sum + (m ? eff.cost * ing.qty : 0);
    }, 0);

  const tabs = [
    { id: "overview", label: "總覽", icon: BarChart3 },
    { id: "materials", label: "物料成本", icon: Package },
    { id: "recipes", label: "配方成本", icon: Coffee },
  ];

  return (
    <div className="min-h-screen bg-stone-200 flex justify-center py-6 px-3">
      <div className="w-full max-w-md">
        <div className="bg-stone-50 rounded-t-sm shadow-lg overflow-hidden">
          <PerfEdge />
          <header className="px-5 pt-1 pb-4 text-center">
            <p className="text-xs tracking-widest text-stone-500 font-mono mt-2">MATERIAL COST LEDGER</p>
            <h1 className="text-2xl font-black text-stone-800 tracking-tight mt-1">物料成本帳</h1>
            <p className="text-xs text-stone-500 mt-1 font-mono">
              品項 {materials.length} · 配方 {recipes.length}
            </p>
          </header>

          <div className="px-4 pb-28" style={{ minHeight: "60vh" }}>
            {tab === "overview" && (
              <Overview materials={materials} recipes={recipes} recipeCost={recipeCost} />
            )}
            {tab === "materials" && (
              <Materials materials={materials} setMaterials={setMaterials} />
            )}
            {tab === "recipes" && (
              <Recipes materials={materials} recipes={recipes} setRecipes={setRecipes} recipeCost={recipeCost} />
            )}
          </div>

          <PerfEdge flip />
        </div>

        <nav className="mt-3 bg-teal-800 rounded-lg shadow-lg flex overflow-hidden">
          {tabs.map((t) => {
            const TabIcon = t.icon;
            const active = tab === t.id;
            return (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={`flex-1 flex flex-col items-center gap-1 py-2.5 text-xs font-medium transition-colors ${
                  active ? "bg-teal-900 text-amber-300" : "text-teal-100"
                }`}
              >
                <TabIcon size={18} strokeWidth={active ? 2.4 : 1.8} />
                {t.label}
              </button>
            );
          })}
        </nav>
        <p className="text-center text-xs text-stone-400 mt-2">資料會自動儲存在這台裝置的瀏覽器中</p>
      </div>
    </div>
  );
}

// ---------- 總覽 ----------
function Overview({ materials, recipes, recipeCost }) {
  const rows = recipes
    .map((r) => {
      const cost = recipeCost(r);
      const margin = r.sellPrice - cost;
      const rate = r.sellPrice ? (margin / r.sellPrice) * 100 : 0;
      return { ...r, cost, margin, rate };
    })
    .sort((a, b) => a.rate - b.rate);

  const avgRate = rows.length > 0 ? rows.reduce((s, r) => s + r.rate, 0) / rows.length : 0;
  const lowMargin = rows.filter((r) => r.rate < 40);

  return (
    <div className="pt-3 space-y-4">
      <div className="grid grid-cols-2 gap-3">
        <StatCard label="物料品項" value={materials.length} unit="項" />
        <StatCard label="平均毛利率" value={avgRate.toFixed(1)} unit="%" accent />
      </div>

      {lowMargin.length > 0 && (
        <div className="bg-amber-50 border border-amber-300 rounded-md px-3 py-2 flex gap-2 items-start">
          <AlertTriangle size={16} className="text-amber-600 mt-0.5 shrink-0" />
          <p className="text-xs text-amber-800 leading-relaxed">
            {lowMargin.map((r) => r.name).join("、")} 毛利率低於 40%，建議檢視售價或配方用料。
          </p>
        </div>
      )}

      <div>
        <p className="text-xs font-mono text-stone-500 mb-2 tracking-wide">飲品毛利排行（低到高）</p>
        <div className="bg-white rounded-md divide-y divide-dashed divide-stone-300">
          {rows.map((r) => (
            <div key={r.id} className="px-3 py-2.5 flex items-center justify-between text-sm">
              <div className="min-w-0">
                <p className="text-stone-800 font-medium truncate">{r.name}</p>
                <p className="text-xs text-stone-500 font-mono">
                  成本 <Money value={r.cost} /> · 售價 <Money value={r.sellPrice} />
                </p>
              </div>
              <div className={`flex items-center gap-1 font-mono text-sm shrink-0 ml-2 ${r.rate < 40 ? "text-rose-600" : "text-teal-700"}`}>
                {r.rate < 40 ? <TrendingDown size={14} /> : <TrendingUp size={14} />}
                {r.rate.toFixed(1)}%
              </div>
            </div>
          ))}
          {rows.length === 0 && (
            <p className="text-center text-xs text-stone-400 py-6">到「配方成本」分頁新增第一個飲品配方吧</p>
          )}
        </div>
      </div>
    </div>
  );
}

function StatCard({ label, value, unit, accent }) {
  return (
    <div className="bg-white rounded-md px-3 py-3 text-center">
      <p className="text-xs text-stone-500 font-mono">{label}</p>
      <p className={`text-2xl font-black font-mono mt-0.5 ${accent ? "text-teal-700" : "text-stone-800"}`}>
        {value}
        <span className="text-xs font-normal ml-0.5">{unit}</span>
      </p>
    </div>
  );
}

// ---------- 物料成本 ----------
function Materials({ materials, setMaterials }) {
  const [editing, setEditing] = useState(null);
  const emptyForm = {
    name: "", supplier: "", purchaseUnit: "克",
    packCount: "1", packSize: "", totalPrice: "",
    hasConversion: false, convInputQty: "", convOutputQty: "", convOutputUnit: "毫升",
  };
  const [form, setForm] = useState(emptyForm);

  const openNew = () => { setForm(emptyForm); setEditing("new"); };
  const openEdit = (m) => {
    setForm({
      name: m.name, supplier: m.supplier || "", purchaseUnit: m.purchaseUnit,
      packCount: String(m.packCount), packSize: String(m.packSize), totalPrice: String(m.totalPrice),
      hasConversion: !!m.conversion,
      convInputQty: m.conversion ? String(m.conversion.inputQty) : "",
      convOutputQty: m.conversion ? String(m.conversion.outputQty) : "",
      convOutputUnit: m.conversion ? m.conversion.outputUnit : "毫升",
    });
    setEditing(m.id);
  };

  const packCountNum = Number(form.packCount) || 1;
  const packSizeNum = Number(form.packSize) || 0;
  const totalPriceNum = Number(form.totalPrice) || 0;
  const totalQtyDraft = packCountNum * packSizeNum;
  const purchaseUnitCostDraft = totalQtyDraft > 0 ? totalPriceNum / totalQtyDraft : 0;
  const perPackCostDraft = packCountNum > 0 ? totalPriceNum / packCountNum : 0;
  const convInputNum = Number(form.convInputQty) || 0;
  const convOutputNum = Number(form.convOutputQty) || 0;
  const inputCostDraft = convInputNum * purchaseUnitCostDraft;
  const convertedCostDraft = convOutputNum > 0 ? inputCostDraft / convOutputNum : 0;

  const save = () => {
    if (!form.name.trim() || !packSizeNum || !totalPriceNum) return;
    const conversion = form.hasConversion && convOutputNum > 0
      ? { inputQty: convInputNum, outputQty: convOutputNum, outputUnit: form.convOutputUnit }
      : null;
    const data = {
      name: form.name.trim(), supplier: form.supplier.trim(), purchaseUnit: form.purchaseUnit,
      packCount: packCountNum, packSize: packSizeNum, totalPrice: totalPriceNum, conversion,
    };
    if (editing === "new") setMaterials((prev) => [...prev, { id: uid(), ...data }]);
    else setMaterials((prev) => prev.map((m) => (m.id === editing ? { ...m, ...data } : m)));
    setEditing(null);
  };

  const remove = (id) => setMaterials((prev) => prev.filter((m) => m.id !== id));

  return (
    <div className="pt-3">
      <div className="flex items-center justify-between mb-2">
        <p className="text-xs font-mono text-stone-500 tracking-wide">物料清單 · 實際使用成本</p>
        <button onClick={openNew} className="flex items-center gap-1 text-xs font-medium text-teal-700 px-2 py-1 rounded hover:bg-emerald-50">
          <Plus size={14} /> 新增物料
        </button>
      </div>

      <div className="bg-white rounded-md divide-y divide-dashed divide-stone-300">
        {materials.map((m) => {
          const eff = getEffective(m);
          return (
            <div key={m.id} className="px-3 py-2.5 flex items-center justify-between text-sm">
              <div className="min-w-0">
                <p className="text-stone-800 font-medium truncate">{m.name}</p>
                {m.conversion ? (
                  <p className="text-xs text-stone-500 font-mono truncate">
                    採購 ${unitMoney(eff.purchaseCost)}/{m.purchaseUnit} → 沖泡後 ${unitMoney(eff.cost)}/{eff.unit}
                  </p>
                ) : (
                  <p className="text-xs text-stone-500 font-mono truncate">{m.supplier || "未填供應商"}</p>
                )}
              </div>
              <div className="flex items-center gap-2 shrink-0 ml-2">
                <span className="font-mono text-sm text-teal-700 font-semibold">${unitMoney(eff.cost)}/{eff.unit}</span>
                <button onClick={() => openEdit(m)} className="p-1.5 text-stone-400 hover:text-stone-700"><Pencil size={14} /></button>
                <button onClick={() => remove(m.id)} className="p-1.5 text-stone-400 hover:text-rose-600"><Trash2 size={14} /></button>
              </div>
            </div>
          );
        })}
        {materials.length === 0 && <p className="text-center text-xs text-stone-400 py-6">尚未新增任何物料</p>}
      </div>

      {editing && (
        <Modal onClose={() => setEditing(null)} title={editing === "new" ? "新增物料" : "編輯物料"}>
          <p className="text-xs text-stone-500 mb-3 leading-relaxed">
            先填「採購資訊」算出基本單價；如果這項物料要先沖泡或調製才能用（例如茶葉沖泡成茶湯），再往下加「沖泡／調製轉換」。
          </p>

          <Field label="品項名稱">
            <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="例如：紅茶葉" className="input" />
          </Field>

          <Field label="採購單位">
            <select value={form.purchaseUnit} onChange={(e) => setForm({ ...form, purchaseUnit: e.target.value })} className="input">
              {["克", "毫升", "個", "份"].map((u) => <option key={u} value={u}>{u}</option>)}
            </select>
          </Field>

          <div className="grid grid-cols-2 gap-3">
            <Field label="每箱幾件（單一包裝填1）">
              <input type="number" inputMode="numeric" value={form.packCount} onChange={(e) => setForm({ ...form, packCount: e.target.value })} placeholder="1" className="input" />
            </Field>
            <Field label={`每件多少${form.purchaseUnit}`}>
              <input type="number" inputMode="decimal" value={form.packSize} onChange={(e) => setForm({ ...form, packSize: e.target.value })} placeholder="例如：6000" className="input" />
            </Field>
          </div>

          <Field label="整箱／整批總金額（元）">
            <input type="number" inputMode="decimal" value={form.totalPrice} onChange={(e) => setForm({ ...form, totalPrice: e.target.value })} placeholder="例如：13500" className="input" />
          </Field>

          {packSizeNum > 0 && totalPriceNum > 0 && (
            <div className="bg-emerald-50 border border-emerald-200 rounded-md px-3 py-2 space-y-1 mb-3">
              <div className="flex items-center justify-between text-xs text-emerald-800">
                <span>採購總量</span>
                <span className="font-mono">{totalQtyDraft.toLocaleString("zh-TW")} {form.purchaseUnit}</span>
              </div>
              {packCountNum > 1 && (
                <div className="flex items-center justify-between text-xs text-emerald-800">
                  <span>每件成本</span>
                  <span className="font-mono">${money(perPackCostDraft)}</span>
                </div>
              )}
              <div className="flex items-center justify-between text-sm">
                <span className="text-emerald-800 font-medium">每{form.purchaseUnit}成本</span>
                <span className="font-mono font-semibold text-teal-700">${unitMoney(purchaseUnitCostDraft)}</span>
              </div>
            </div>
          )}

          {!form.hasConversion ? (
            <button type="button" onClick={() => setForm({ ...form, hasConversion: true })}
              className="w-full flex items-center justify-center gap-1 text-xs font-medium text-teal-700 border border-dashed border-teal-300 rounded-md py-2 hover:bg-teal-50 mb-3">
              <Plus size={13} /> 加入沖泡／調製轉換（例如茶葉沖泡成茶湯）
            </button>
          ) : (
            <div className="border border-teal-200 bg-teal-50 rounded-md p-3 space-y-2 mb-3">
              <div className="flex items-center justify-between">
                <span className="text-xs font-medium text-teal-800">沖泡／調製轉換</span>
                <button type="button" onClick={() => setForm({ ...form, hasConversion: false })} className="text-stone-400 hover:text-rose-600"><X size={14} /></button>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <Field label={`每次用多少${form.purchaseUnit}`}>
                  <input type="number" inputMode="decimal" value={form.convInputQty} onChange={(e) => setForm({ ...form, convInputQty: e.target.value })} placeholder="例如：80" className="input" />
                </Field>
                <Field label="可以做出多少">
                  <input type="number" inputMode="decimal" value={form.convOutputQty} onChange={(e) => setForm({ ...form, convOutputQty: e.target.value })} placeholder="例如：6500" className="input" />
                </Field>
              </div>
              <Field label="產出單位">
                <select value={form.convOutputUnit} onChange={(e) => setForm({ ...form, convOutputUnit: e.target.value })} className="input">
                  {["毫升", "克", "個", "份"].map((u) => <option key={u} value={u}>{u}</option>)}
                </select>
              </Field>
              {convOutputNum > 0 && purchaseUnitCostDraft > 0 && (
                <div className="bg-white rounded-md px-2 py-1.5 text-xs text-stone-600 leading-relaxed">
                  {form.convInputQty}{form.purchaseUnit} × ${unitMoney(purchaseUnitCostDraft)} = ${money(inputCostDraft)}，做出 {form.convOutputQty}{form.convOutputUnit}
                  <div className="text-sm font-semibold text-teal-700 mt-1">→ 每{form.convOutputUnit}成本 ${unitMoney(convertedCostDraft)}</div>
                </div>
              )}
            </div>
          )}

          <Field label="供應商（選填）">
            <input value={form.supplier} onChange={(e) => setForm({ ...form, supplier: e.target.value })} placeholder="例如：大盤茶行" className="input" />
          </Field>

          <button onClick={save} className="save-btn"><Check size={16} /> 儲存</button>
        </Modal>
      )}
    </div>
  );
}

// ---------- 配方成本 ----------
function Recipes({ materials, recipes, setRecipes, recipeCost }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: "", sellPrice: "", ingredients: [] });

  const openNew = () => { setForm({ name: "", sellPrice: "", ingredients: [] }); setEditing("new"); };
  const openEdit = (r) => {
    setForm({ name: r.name, sellPrice: r.sellPrice, ingredients: r.ingredients.map((i) => ({ ...i })) });
    setEditing(r.id);
  };

  const addIngredient = () => {
    if (materials.length === 0) return;
    setForm((f) => ({ ...f, ingredients: [...f.ingredients, { materialId: materials[0].id, qty: "" }] }));
  };
  const updateIngredient = (idx, patch) => {
    setForm((f) => ({ ...f, ingredients: f.ingredients.map((ing, i) => (i === idx ? { ...ing, ...patch } : ing)) }));
  };
  const removeIngredient = (idx) => {
    setForm((f) => ({ ...f, ingredients: f.ingredients.filter((_, i) => i !== idx) }));
  };

  const draftCost = form.ingredients.reduce((sum, ing) => {
    const m = materials.find((x) => x.id === ing.materialId);
    const eff = getEffective(m);
    return sum + (ing.qty ? Number(ing.qty) * eff.cost : 0);
  }, 0);

  const save = () => {
    if (!form.name.trim() || form.ingredients.length === 0) return;
    const cleanIngredients = form.ingredients
      .filter((i) => i.qty !== "" && !isNaN(Number(i.qty)))
      .map((i) => ({ materialId: i.materialId, qty: Number(i.qty) }));
    if (editing === "new") {
      setRecipes((prev) => [...prev, { id: uid(), name: form.name.trim(), sellPrice: Number(form.sellPrice) || 0, ingredients: cleanIngredients }]);
    } else {
      setRecipes((prev) => prev.map((r) => (r.id === editing ? { ...r, name: form.name.trim(), sellPrice: Number(form.sellPrice) || 0, ingredients: cleanIngredients } : r)));
    }
    setEditing(null);
  };

  const remove = (id) => setRecipes((prev) => prev.filter((r) => r.id !== id));

  return (
    <div className="pt-3">
      <div className="flex items-center justify-between mb-2">
        <p className="text-xs font-mono text-stone-500 tracking-wide">飲品配方 · 成本試算</p>
        <button onClick={openNew} disabled={materials.length === 0} className="flex items-center gap-1 text-xs font-medium text-teal-700 px-2 py-1 rounded hover:bg-emerald-50 disabled:opacity-40">
          <Plus size={14} /> 新增配方
        </button>
      </div>

      <div className="space-y-2">
        {recipes.map((r) => {
          const cost = recipeCost(r);
          const margin = r.sellPrice - cost;
          const rate = r.sellPrice ? (margin / r.sellPrice) * 100 : 0;
          return (
            <div key={r.id} className="bg-white rounded-md px-3 py-2.5">
              <div className="flex items-center justify-between">
                <p className="text-stone-800 font-medium text-sm">{r.name}</p>
                <div className="flex items-center gap-1">
                  <button onClick={() => openEdit(r)} className="p-1.5 text-stone-400 hover:text-stone-700"><Pencil size={14} /></button>
                  <button onClick={() => remove(r.id)} className="p-1.5 text-stone-400 hover:text-rose-600"><Trash2 size={14} /></button>
                </div>
              </div>
              <div className="flex items-center gap-4 mt-1 text-xs font-mono">
                <span className="text-stone-500">成本 <Money value={cost} className="text-stone-800" /></span>
                <span className="text-stone-500">售價 <Money value={r.sellPrice} className="text-stone-800" /></span>
                <span className={rate < 40 ? "text-rose-600" : "text-teal-700"}>毛利 {rate.toFixed(1)}%</span>
              </div>
            </div>
          );
        })}
        {recipes.length === 0 && <p className="text-center text-xs text-stone-400 py-6">尚未新增任何配方</p>}
      </div>

      {editing && (
        <Modal onClose={() => setEditing(null)} title={editing === "new" ? "新增配方" : "編輯配方"}>
          <Field label="飲品名稱">
            <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="例如：招牌紅茶拿鐵" className="input" />
          </Field>
          <Field label="售價（元）">
            <input type="number" inputMode="decimal" value={form.sellPrice} onChange={(e) => setForm({ ...form, sellPrice: e.target.value })} placeholder="0" className="input" />
          </Field>

          <div className="mt-1">
            <div className="flex items-center justify-between mb-1">
              <span className="text-xs text-stone-500">用料明細</span>
              <button onClick={addIngredient} disabled={materials.length === 0} className="text-xs text-teal-700 font-medium flex items-center gap-1 disabled:opacity-40">
                <Plus size={13} /> 加入物料
              </button>
            </div>
            <div className="space-y-2">
              {form.ingredients.map((ing, idx) => {
                const m = materials.find((x) => x.id === ing.materialId);
                const eff = getEffective(m);
                const lineCost = ing.qty ? Number(ing.qty) * eff.cost : 0;
                return (
                  <div key={idx} className="flex items-center gap-2">
                    <select value={ing.materialId} onChange={(e) => updateIngredient(idx, { materialId: e.target.value })} className="input flex-1">
                      {materials.map((mm) => <option key={mm.id} value={mm.id}>{mm.name}</option>)}
                    </select>
                    <div className="flex items-center gap-1 shrink-0">
                      <input type="number" inputMode="decimal" value={ing.qty} onChange={(e) => updateIngredient(idx, { qty: e.target.value })} placeholder="用量" className="input w-16" />
                      <span className="text-xs text-stone-400 w-7">{eff.unit}</span>
                    </div>
                    <span className="font-mono text-xs text-stone-500 w-14 text-right shrink-0">{ing.qty ? `$${money(lineCost)}` : "—"}</span>
                    <button onClick={() => removeIngredient(idx)} className="p-1.5 text-stone-400 hover:text-rose-600 shrink-0"><X size={15} /></button>
                  </div>
                );
              })}
              {form.ingredients.length === 0 && <p className="text-xs text-stone-400">尚未加入物料</p>}
            </div>
          </div>

          <Dashed />
          <div className="flex items-center justify-between text-sm">
            <span className="text-stone-500">預估成本</span>
            <Money value={draftCost} className="text-stone-800 font-semibold" />
          </div>
          {form.sellPrice ? (
            <div className="flex items-center justify-between text-sm">
              <span className="text-stone-500">預估毛利率</span>
              <span className="font-mono font-semibold text-teal-700">
                {(((Number(form.sellPrice) - draftCost) / Number(form.sellPrice)) * 100).toFixed(1)}%
              </span>
            </div>
          ) : null}

          <button onClick={save} className="save-btn"><Check size={16} /> 儲存</button>
        </Modal>
      )}
    </div>
  );
}

// ---------- 共用元件 ----------
function Field({ label, children }) {
  return (
    <label className="block mb-3">
      <span className="block text-xs text-stone-500 mb-1">{label}</span>
      {children}
    </label>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4" style={{ backgroundColor: "rgba(0,0,0,0.4)" }}>
      <div className="bg-stone-50 w-full sm:max-w-sm sm:rounded-md rounded-t-xl overflow-y-auto" style={{ maxHeight: "85vh" }}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-dashed border-stone-300 sticky top-0 bg-stone-50">
          <h2 className="font-semibold text-stone-800 text-sm">{title}</h2>
          <button onClick={onClose} className="p-1 text-stone-400 hover:text-stone-700"><X size={18} /></button>
        </div>
        <div className="px-4 py-4">{children}</div>
      </div>
      <style>{`
        .input { width: 100%; background: white; border: 1px solid #D6D3D1; border-radius: 6px; padding: 8px 10px; font-size: 14px; color: #292524; }
        .input:focus { outline: 2px solid #0F766E; outline-offset: 1px; }
        .save-btn { width: 100%; margin-top: 8px; background: #0F766E; color: white; font-weight: 600; font-size: 14px; border-radius: 6px; padding: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CostTracker />);
</script>
</body>
</html>
